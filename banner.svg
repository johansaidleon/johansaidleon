<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#141a2a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="1" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="300" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glowA)"/>
    <rect width="1200" height="300" fill="url(#glowB)"/>

    <!-- escudo decorativo -->
    <g transform="translate(985 70)" fill="none" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="2.5">
      <path d="M80 0 L150 26 V86 C150 130 120 160 80 176 C40 160 10 130 10 86 V26 Z"/>
      <rect x="56" y="78" width="48" height="38" rx="6"/>
      <path d="M64 78 V64 a16 16 0 0 1 32 0 V78"/>
      <circle cx="80" cy="97" r="4" fill="#2dd4bf" fill-opacity="0.5"/>
    </g>
    <g fill="#2dd4bf" fill-opacity="0.25">
      <circle cx="930" cy="60" r="2"/><circle cx="1160" cy="240" r="2"/>
      <circle cx="950" cy="250" r="1.5"/><circle cx="1150" cy="50" r="1.5"/>
    </g>

    <!-- terminal -->
    <text x="70" y="88" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#2dd4bf">
      ~/bogota $ whoami
    </text>
    <rect x="246" y="74" width="10" height="18" fill="#2dd4bf">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- nombre -->
    <text x="68" y="152" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" fill="#f0f3f6" letter-spacing="0.5">
      Johan Said Leon
    </text>
    <rect x="70" y="170" width="120" height="3" rx="1.5" fill="url(#line)"/>

    <text x="70" y="208" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#9aa4b2">
      Ingeniero de Sistemas  ·  Desarrollador Full Stack  ·  Seguridad y Redes
    </text>

    <!-- etiquetas -->
    <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#c9d1d9">
      <rect x="70" y="232" width="118" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.45"/>
      <text x="129" y="251" text-anchor="middle">full-stack</text>
      <rect x="198" y="232" width="118" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.45"/>
      <text x="257" y="251" text-anchor="middle">security</text>
      <rect x="326" y="232" width="118" height="28" rx="14" fill="#6366f1" fill-opacity="0.10" stroke="#6366f1" stroke-opacity="0.55"/>
      <text x="385" y="251" text-anchor="middle">networking</text>
      <rect x="454" y="232" width="138" height="28" rx="14" fill="#6366f1" fill-opacity="0.10" stroke="#6366f1" stroke-opacity="0.55"/>
      <text x="523" y="251" text-anchor="middle">applied-ai</text>
    </g>
  </g>
</svg>
